services:
  # ========================================================
  # Service 1: Development Server (Default)
  # - Hot Module Replacement (HMR) aktif
  # - Membaca port FE & backend URL dinamis dari .env
  # - Menyimpan error log internal ke logs/fe-YYYY-MM-DD.log di host
  # ========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: test-vue-frontend
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      - IS_DOCKER=true
      - VITE_PORT=${VITE_PORT:-5173}
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://host.docker.internal:8080}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      - VITE_APP_TITLE=${VITE_APP_TITLE:-Golang API Frontend Tester}
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ========================================================
  # Service 2: Production Server (Nginx)
  # - Jalankan dengan: docker compose --profile prod up -d --build
  # - Menggunakan build statis optimal yang dilayani Nginx
  # ========================================================
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_PORT=${VITE_PORT:-5173}
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://host.docker.internal:8080}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_APP_TITLE=${VITE_APP_TITLE:-Golang API Frontend Tester}
    container_name: test-vue-frontend-prod
    ports:
      - "${VITE_PROD_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - prod
      - production
    restart: unless-stopped
